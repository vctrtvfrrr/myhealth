name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - uses: android-actions/setup-android@v3

      - run: ./gradlew build --no-daemon

      - run: ./gradlew :ingestion-api:buildImage --no-daemon

      - name: Verify the image runs as uid 1000
        run: test "$(docker run --rm --entrypoint id myhealthbridge-api:local -u)" = "1000"
