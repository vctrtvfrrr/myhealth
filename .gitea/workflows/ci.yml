name: ci

# A branch is validated by its pull request; pushing it as well would run the same revision twice.
on:
  push:
    branches:
      - master
  pull_request:

# Master stays serialized, because each push there computes its version from the previous release.
# Anywhere else only the newest revision matters.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

env:
  REGISTRY: git.codelab.tec.br
  IMAGE: git.codelab.tec.br/vctrtvfrrr/myhealth-api
  TAG: ${{ github.sha }}

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      # The whole history and its tags only on master, where the release version is read from the
      # commits since the last release tag.
      - uses: actions/checkout@v4
        with:
          fetch-depth: ${{ github.event_name == 'push' && '0' || '1' }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-api-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-api-

      - name: Decide the release version
        id: version
        if: github.event_name == 'push'
        run: echo "version=$(bash .gitea/scripts/next-version.sh HEAD)" >> "$GITHUB_OUTPUT"

      # Built straight under the name of its commit: every run shares one Docker daemon, and a tag
      # shared between runs is moved by whichever builds last, which once deployed a pull request.
      - name: Test and build the image
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          ./gradlew :contract:check :ingestion-api:check :ingestion-api:buildImage \
            "-Pmyhealth.image=${IMAGE}:${TAG}" "-Pmyhealth.revision=$TAG" \
            ${RELEASE_VERSION:+"-Pmyhealth.version=$RELEASE_VERSION"}

      - name: Verify the image runs as uid 1000
        run: test "$(docker run --rm --entrypoint id "${IMAGE}:${TAG}" -u)" = "1000"

  android:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: ${{ github.event_name == 'push' && '0' || '1' }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-android-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-android-

      # A fixed location, so the SDK restored from the cache is the one setup-android finds and the
      # one the Android Gradle Plugin adds the platform and build tools to.
      - name: Place the Android SDK under the home directory
        run: |
          echo "ANDROID_HOME=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> "$GITHUB_ENV"

      - uses: actions/cache@v4
        with:
          path: ~/android-sdk
          key: ${{ runner.os }}-android-sdk-${{ hashFiles('android-app/build.gradle.kts', 'health-*/build.gradle.kts', 'maintenance/build.gradle.kts', 'gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-android-sdk-

      # The action's default also asks for the legacy 'tools' package, which the SDK repository no
      # longer serves, so the install fails before anything is built.
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Provision the Samsung Health Data SDK
        env:
          SAMSUNG_HEALTH_SDK_URL: ${{ secrets.SAMSUNG_HEALTH_SDK_URL }}
          SAMSUNG_HEALTH_SDK_TOKEN: ${{ secrets.SAMSUNG_HEALTH_SDK_TOKEN }}
        run: |
          if [ -z "$SAMSUNG_HEALTH_SDK_URL" ] || [ -z "$SAMSUNG_HEALTH_SDK_TOKEN" ]; then
            echo "Set the SAMSUNG_HEALTH_SDK_URL and SAMSUNG_HEALTH_SDK_TOKEN secrets to the private" >&2
            echo "location of the Samsung Health Data SDK v1.1.0 AAR. The artifact is not in Git." >&2
            exit 1
          fi
          mkdir -p android-app/libs
          curl -fsSL -H "Authorization: Bearer $SAMSUNG_HEALTH_SDK_TOKEN" \
            "$SAMSUNG_HEALTH_SDK_URL" -o android-app/libs/samsung-health-data-api-1.1.0.aar

      # Empty when the commits since the last release ship no change, and then nothing is released.
      - name: Decide the release version
        id: version
        if: github.event_name == 'push'
        run: |
          version="$(bash .gitea/scripts/next-version.sh HEAD)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Release version: ${version:-none}"

      # The debug variant only: the release variant runs the same unit tests over the same code, and
      # is built further down, and only for a release.
      - run: ./gradlew testDebugUnitTest lintDebug :android-app:assembleDebug

      # The key never meets a revision that is not already on master: the build it drives is that
      # revision's own code, so any branch reaching this step could copy the key anywhere.
      - name: Build the signed release APK
        if: steps.version.outputs.version != ''
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          MYHEALTH_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          MYHEALTH_RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          MYHEALTH_RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 is not configured for this repository"
            exit 1
          fi
          # The runner is self-hosted and shared: the key lands outside the workspace, unreadable to
          # the other workloads on the host, and goes away even when the build fails.
          export MYHEALTH_RELEASE_KEYSTORE="$RUNNER_TEMP/myhealth-release-$GITHUB_RUN_ID.jks"
          trap 'rm -f "$MYHEALTH_RELEASE_KEYSTORE"' EXIT
          (umask 077 && printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$MYHEALTH_RELEASE_KEYSTORE")
          ./gradlew :android-app:assembleRelease "-Pmyhealth.version=$RELEASE_VERSION"

      # Only hands the APK to the release job, which may run in another workspace; the release is
      # where it is published.
      - name: Hand the APK to the release job
        if: steps.version.outputs.version != ''
        uses: actions/upload-artifact@v7
        with:
          name: myhealth-bridge-${{ github.sha }}
          path: android-app/build/outputs/apk/release/android-app-release.apk
          if-no-files-found: error
          retention-days: 1

  # The API goes out only once the whole suite passed, the application's included.
  deploy:
    needs: [api, android]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The action renders an unset secret as an empty variable, and an empty variable would only
      # be diagnosed by the API crash-looping after a green deploy.
      - name: Check the runtime configuration
        env:
          DATABASE_PASS: ${{ secrets.DATABASE_PASS }}
        run: |
          for name in DATABASE_PASS; do
            eval "value=\${$name}"
            if [ -z "$value" ]; then
              echo "::error::$name is not configured for this repository"
              exit 1
            fi
          done

      - name: Registry login
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ gitea.actor }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Publish the image
        run: docker push "${IMAGE}:${TAG}"

      - name: Deploy the stack
        uses: https://git.codelab.tec.br/codelab/deploy-stack@master
        with:
          app: myhealth
          image-tag: ${{ env.TAG }}
        env:
          APPENV_DATABASE_HOST: postgres
          APPENV_DATABASE_PORT: "5432"
          # The platform provisions role and database under the name of the app itself, so an unset
          # variable falls back to it instead of reaching the API blank.
          APPENV_DATABASE_NAME: ${{ vars.DATABASE_NAME || 'myhealth' }}
          APPENV_DATABASE_USER: ${{ vars.DATABASE_USER || 'myhealth' }}
          APPENV_DATABASE_PASS: ${{ secrets.DATABASE_PASS }}

      # The action returns once Compose accepted the container, which says nothing about the
      # migrations having run. Only the healthcheck does.
      - name: Wait for the API to serve
        run: |
          for _ in $(seq 60); do
            status=$(docker inspect --format '{{.State.Health.Status}}' myhealth-api 2>/dev/null || echo missing)
            if [ "$status" = healthy ]; then exit 0; fi
            sleep 5
          done
          echo "::error::the API never became healthy after the deploy"
          docker logs --tail 50 myhealth-api || true
          exit 1

  # Only once the API is serving does the version exist: a release names an APK and an API that
  # actually run together.
  release:
    needs: [android, deploy]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && needs.android.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      code: read
      releases: write
    env:
      RELEASE_VERSION: ${{ needs.android.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install release tools
        run: |
          if ! command -v jq >/dev/null; then
            apt-get update
            apt-get install --yes --no-install-recommends jq
          fi

      - uses: actions/download-artifact@v7
        with:
          name: myhealth-bridge-${{ github.sha }}
          path: release

      - name: Publish the release
        env:
          RELEASE_COMMIT: ${{ github.sha }}
          RELEASE_APK: release/android-app-release.apk
          GITEA_API_URL: ${{ gitea.api_url }}
          GITEA_REPOSITORY: ${{ gitea.repository }}
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
        run: bash .gitea/scripts/release.sh

      - name: Registry login
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ gitea.actor }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      # After the release, so a version whose tag belongs to another commit never names this image.
      - name: Name the image after the version
        run: |
          docker tag "${IMAGE}:${TAG}" "${IMAGE}:${RELEASE_VERSION}"
          docker push "${IMAGE}:${RELEASE_VERSION}"
