services:
  postgres:
    image: postgres:17
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: myhealth
      POSTGRES_PASSWORD: myhealth
      POSTGRES_DB: myhealth
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U myhealth -d myhealth']
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    image: myhealth-api:local
    env_file:
      - .env
    ports:
      - "8039:8039"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
