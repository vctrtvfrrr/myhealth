services:
  postgres:
    image: postgres:17
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: myhealth
      POSTGRES_PASSWORD: myhealth
      POSTGRES_DB: myhealth
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U myhealth -d myhealth']
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    image: myhealth-api:local
    env_file:
      - .env
    ports:
      - "8039:8039"
    depends_on:
      postgres:
        condition: service_healthy

  # The dashboards as the platform shows them, read from production through an SSH tunnel as
  # myhealth_read (ADR 0028). Started by `./gradlew previewUp`; see observability/README.md.
  grafana:
    image: grafana/grafana:13.1
    profiles:
      - preview
    environment:
      MYHEALTH_READ_PASSWORD: ${MYHEALTH_READ_PASSWORD:-}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Editor
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - '127.0.0.1:3039:3000'
    volumes:
      - ./build/grafana-preview/provisioning:/etc/grafana/provisioning:ro
      - ./build/grafana-preview/dashboards:/etc/grafana/dashboards:ro

volumes:
  pgdata:
